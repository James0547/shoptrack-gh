<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Change password — ShopTrack GH</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <form method="post" class="bg-white p-8 rounded-xl shadow w-96">
    <div class="flex items-center gap-2 mb-2">
      <img src="{{ url_for('static', filename='img/track.png') }}" class="w-8 h-8" alt="">
      <div class="font-semibold">Change password</div>
    </div>
    <p class="text-xs text-slate-500 mb-4">
      Signed in as <b>{{ session.user.username }}</b>. You must change your password before continuing.
    </p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="mb-3 text-sm p-2 rounded {{ 'bg-red-100 text-red-700' if cat=='error' else 'bg-emerald-100 text-emerald-700' }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    <label class="block text-sm mb-1">Current password</label>
    <input name="current" type="password" required class="w-full border rounded px-3 py-2 mb-3" autofocus>
    <label class="block text-sm mb-1">New password (min 8 chars)</label>
    <input name="new" type="password" required minlength="8" class="w-full border rounded px-3 py-2 mb-3">
    <label class="block text-sm mb-1">Confirm new password</label>
    <input name="confirm" type="password" required minlength="8" class="w-full border rounded px-3 py-2 mb-4">
    <button class="w-full bg-emerald-600 text-white rounded py-2 font-medium">Update password</button>
    <div class="text-center mt-3"><a href="{{ url_for('logout') }}" class="text-xs text-slate-500 underline">Cancel (log out)</a></div>
  </form>
</body>
</html>
