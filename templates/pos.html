<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShopTrack GH — POS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='js/pos.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/alpine.min.js') }}"></script>
</head>
<body class="bg-slate-100 text-slate-900">
<header class="bg-slate-900 text-white px-6 py-3 flex items-center gap-3">
  <img src="{{ url_for('static', filename='img/track.png') }}" class="w-8 h-8" alt="">
  <div class="font-semibold">ShopTrack GH — POS</div>
  <span class="text-xs bg-slate-700 px-2 py-1 rounded">{{ receipt_preview }}</span>
  <div class="ml-auto text-sm opacity-80">{{ session.user.display_name }}</div>
  {% if session.user.role == 'admin' %}
    <a href="{{ url_for('admin_dashboard') }}" class="text-sm underline">Products</a>
    <a href="{{ url_for('admin_reports') }}" class="text-sm underline">Reports</a>
  {% endif %}
  <a href="{{ url_for('logout') }}" class="text-sm underline">Logout</a>
</header>

<main class="grid grid-cols-3 gap-4 p-4 h-[calc(100vh-56px)] box-border"
      x-data="posApp()" x-init="init()">

  <!-- LEFT: search + results + quick buttons -->
  <section class="col-span-2 flex flex-col gap-3 min-h-0">
    <div class="bg-white rounded-xl shadow p-3">
      <div class="flex items-center gap-2">
        <span class="text-slate-400">🔍</span>
        <input id="search-input" type="text" x-model="q" @input.debounce.80ms="doSearch()"
               @keydown.enter.prevent="onEnter()"
               placeholder="Type name, barcode or scan… (e.g. indomie, frytol)"
               class="flex-1 outline-none text-lg py-2">
        <button class="text-sm text-slate-500 hover:text-slate-900" @click="clearSearch()">Clear</button>
      </div>
      <div class="mt-1 text-xs text-slate-400" x-show="status"><span x-text="status"></span></div>
    </div>

    <!-- Results -->
    <div class="bg-white rounded-xl shadow overflow-y-auto flex-1 min-h-0">
      <template x-if="results.length === 0">
        <div class="p-6 text-slate-400 text-center"
             x-text="q ? 'No matches' : 'Type to search, or tap a quick button below'"></div>
      </template>
      <ul>
        <template x-for="r in results" :key="r.id">
          <li class="border-t first:border-t-0 p-3 flex items-center gap-3">
            <div class="flex-1">
              <div class="font-medium" x-text="r.name"></div>
              <div class="text-xs text-slate-500">
                <span x-text="r.category || ''"></span>
                <template x-if="r.low">
                  <span class="ml-2 bg-red-100 text-red-700 px-1 rounded">LOW</span>
                </template>
                <template x-if="r.expiry_date">
                  <span class="ml-2 text-amber-700">EXP: <span x-text="r.expiry_date"></span></span>
                </template>
              </div>
            </div>
            <div class="text-right">
              <div class="font-semibold">₵<span x-text="r.price.toFixed(2)"></span></div>
              <div class="text-xs text-slate-500"><span x-text="r.stock"></span> left</div>
            </div>
            <button class="bg-emerald-600 text-white text-sm px-3 py-2 rounded"
                    @click="addToCart(r.id)">ADD</button>
          </li>
        </template>
      </ul>
    </div>

    <!-- Quick buttons -->
    <div class="bg-white rounded-xl shadow p-3">
      <div class="text-xs text-slate-500 mb-2">Fast buttons (top sellers, 30d)</div>
      <div class="grid grid-cols-6 gap-2">
        <template x-for="t in top" :key="t.id">
          <button class="border rounded py-2 px-1 text-xs hover:bg-slate-50"
                  @click="addToCart(t.id)">
            <div class="font-medium truncate" x-text="t.name"></div>
            <div class="text-slate-500">₵<span x-text="t.price.toFixed(2)"></span></div>
          </button>
        </template>
      </div>
    </div>
  </section>

  <!-- RIGHT: cart -->
  <aside class="bg-white rounded-xl shadow flex flex-col min-h-0">
    <div class="p-3 border-b font-semibold flex items-center">
      Cart
      <span class="ml-2 text-xs bg-slate-200 px-2 py-0.5 rounded" x-text="cart.lines || 0"></span>
      <button class="ml-auto text-xs text-red-600 hover:underline" @click="clearCart()"
              x-show="cart.lines > 0">Clear</button>
    </div>

    <div class="flex-1 overflow-y-auto min-h-0">
      <template x-if="cart.items.length === 0">
        <div class="p-6 text-center text-slate-400">Cart is empty</div>
      </template>
      <ul>
        <template x-for="it in cart.items" :key="it.product_id">
          <li class="p-3 border-t first:border-t-0">
            <div class="flex justify-between gap-2">
              <div class="font-medium text-sm flex-1 truncate" x-text="it.name"></div>
              <div class="font-semibold text-sm">₵<span x-text="it.line_total.toFixed(2)"></span></div>
            </div>
            <div class="flex items-center gap-2 mt-1">
              <button class="w-7 h-7 border rounded" @click="setQty(it.product_id, it.qty - 1)">−</button>
              <input type="number" min="0" class="w-14 border rounded text-center py-0.5"
                     :value="it.qty" @change="setQty(it.product_id, parseInt($event.target.value))">
              <button class="w-7 h-7 border rounded" @click="setQty(it.product_id, it.qty + 1)">+</button>
              <div class="text-xs text-slate-500">@ ₵<span x-text="it.price.toFixed(2)"></span></div>
              <button class="ml-auto text-xs text-red-600" @click="removeItem(it.product_id)">Remove</button>
            </div>
          </li>
        </template>
      </ul>
    </div>

    <div class="p-3 border-t">
      <div class="flex justify-between text-lg font-bold">
        <span>Total</span>
        <span>₵<span x-text="(cart.subtotal || 0).toFixed(2)"></span></span>
      </div>

      <div class="grid grid-cols-3 gap-2 mt-3">
        <button class="bg-slate-900 text-white rounded py-2 text-sm disabled:opacity-50"
                :disabled="cart.lines === 0" @click="openPay('cash')">Cash</button>
        <button class="bg-amber-500 text-white rounded py-2 text-sm disabled:opacity-50"
                :disabled="cart.lines === 0" @click="openPay('momo')">MoMo</button>
        <button class="bg-slate-700 text-white rounded py-2 text-sm disabled:opacity-50"
                :disabled="cart.lines === 0" @click="openPay('card')">Card</button>
      </div>
      <div class="text-xs text-slate-400 mt-2 text-center" x-show="!pay.open">
        Enter to add · Tap payment to complete sale
      </div>

      <!-- Payment panel -->
      <div x-show="pay.open" x-transition class="mt-3 border-t pt-3">
        <div class="text-sm mb-1">
          Paying: <b class="capitalize" x-text="pay.method"></b>
        </div>
        <div class="text-lg font-bold mb-2">
          Total: ₵<span x-text="(cart.subtotal || 0).toFixed(2)"></span>
        </div>
        <template x-if="pay.method === 'cash'">
          <div class="mb-2">
            <label class="text-xs text-slate-600">Amount received</label>
            <input type="number" min="0" step="0.01" x-model.number="pay.received"
                   class="w-full border rounded px-2 py-2 text-lg" autofocus
                   @keydown.enter="confirmPay()">
            <div class="text-xs mt-1" x-show="pay.received > 0">
              Change: ₵<span x-text="Math.max(0, (pay.received - cart.subtotal)).toFixed(2)"></span>
              <span x-show="pay.received < cart.subtotal" class="text-red-600 ml-2">Insufficient!</span>
            </div>
          </div>
        </template>
        <div class="grid grid-cols-2 gap-2">
          <button class="bg-slate-200 rounded py-2" @click="pay.open=false">Cancel</button>
          <button class="bg-emerald-600 text-white rounded py-2 disabled:opacity-50"
                  :disabled="pay.busy || (pay.method==='cash' && pay.received < cart.subtotal)"
                  @click="confirmPay()">
            <span x-show="!pay.busy">Complete sale</span>
            <span x-show="pay.busy">Saving…</span>
          </button>
        </div>
      </div>
    </div>
  </aside>
</main>

<!-- error toast -->
<div x-data="{ show:false, msg:'' }"
     x-on:pos-error.window="msg=$event.detail; show=true; setTimeout(()=>show=false, 2500)"
     x-show="show" x-transition
     class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-red-600 text-white px-4 py-2 rounded shadow">
  <span x-text="msg"></span>
</div>

</body>
</html>
